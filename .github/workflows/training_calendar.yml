name: Training Calendar Test
on: [push]
jobs:
    run-training-calendar:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
            
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                python-version: 3.14

            - name: Install DuckDB
              run: |
                curl -fsSL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o duckdb.zip
                unzip -o duckdb.zip
                chmod +x duckdb
                sudo mv duckdb /usr/local/bin/duckdb

            - name: Create data file
              run: |
                mkdir -p data
                cat > data/training_calendar.txt <<'EOF'
                2026-01-01 Gym Arms
                2026-01-02 Gym Legs
                2026-01-03 Swimming LCM 1.2km
                2026-01-04 Swimming LCM 3.4km
                2026-01-05 Swimming SCM 5.6km
                EOF

            - name: Run pipeline
              run: make run
